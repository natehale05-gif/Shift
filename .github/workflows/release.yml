name: Release desktop and Android builds

# Tag-triggered so releases are deliberate, and so the Pages deploy on every
# push stays untouched. `workflow_dispatch` is here for dry runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.5

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build macos --release

      # Signing is wired but inert: with no certificate secret the app ships
      # unsigned and Gatekeeper asks for a one-time override (documented in the
      # release notes). Adding a certificate later is a secrets change, not a
      # workflow rewrite.
      - name: Sign (skipped without a certificate)
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: echo "Certificate present — add codesign steps here."

      - name: Package .dmg
        run: |
          APP="build/macos/Build/Products/Release/SHIFT AI.app"
          test -d "$APP" || APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p dist staging
          cp -R "$APP" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "SHIFT AI" -srcfolder staging -ov -format UDZO dist/SHIFT-AI-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/SHIFT-AI-macos.dmg

  windows:
    # Pinned, not `windows-latest`. On the latest image Flutter could not
    # detect any Visual Studio install, and its toolchain lookup falls back to
    # the "Visual Studio 16 2019" CMake generator when detection returns
    # nothing — so the build died with "could not find any instance of Visual
    # Studio" rather than a useful message about the toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # Prints the detected Visual Studio and Windows SDK. If this job ever
      # fails on the toolchain again, this is the step that says why.
      - run: flutter doctor -v
      - run: flutter build windows --release

      # The installer is the primary Windows download: Start Menu entry,
      # uninstaller, and a per-user install directory the in-app updater can
      # actually write to. The .zip stays for people who want it portable.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          $version = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^v',''
          & $iscc "/DAppVersion=$version" windows\installer\shift_ai.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Package portable .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SHIFT-AI-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/SHIFT-AI-windows-setup.exe
            dist/SHIFT-AI-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Linux desktop embedder is GTK-based; the runner image does not
      # ship the dev headers.
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build linux --release

      # The .deb is the primary Linux download: it installs to /opt with a
      # launcher entry and icon, so the app shows up in the applications list.
      - name: Build .deb
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          ./linux/packaging/build_deb.sh "${VERSION#v}"

      # Kept alongside it, and not merely for portability: /opt is root-owned,
      # so a .deb install cannot replace itself and the app tells those users
      # to update from the release page. The tarball extracts wherever the
      # user wants, which is what keeps the self-updating path available.
      - name: Package portable .tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/SHIFT-AI-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/SHIFT-AI-linux-amd64.deb
            dist/SHIFT-AI-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # No upload keystore, so this is signed with the debug key: installable
      # from a file manager with "unknown sources" enabled, not Play-ready.
      - run: flutter build apk --release
      - name: Stage .apk
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SHIFT-AI-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/SHIFT-AI-android.apk

  # Every asset the README's install buttons point at. Kept here as the single
  # list the verify job checks, so renaming an asset without updating the
  # README fails the release instead of shipping a dead button.
  #
  # This job exists because a rename did exactly that: the README was pointed
  # at SHIFT-AI-windows-setup.exe and SHIFT-AI-linux-amd64.deb one release
  # before those assets existed, and both buttons 404'd on the live page.

  release:
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SHIFT AI ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            Download the build for your platform below, or use the app in your
            browser at https://natehale05-gif.github.io/Shift/

            | Platform | Install this |
            |---|---|
            | macOS | `SHIFT-AI-macos.dmg` — open it, drag the app to Applications |
            | Windows | `SHIFT-AI-windows-setup.exe` — installer, Start Menu entry, uninstaller |
            | Linux | `SHIFT-AI-linux-amd64.deb` — `sudo dpkg -i SHIFT-AI-linux-amd64.deb`, then find it in your apps |
            | Android | `SHIFT-AI-android.apk` — tap it and confirm the install |

            `SHIFT-AI-windows.zip` and `SHIFT-AI-linux-x64.tar.gz` are portable
            builds for anyone who would rather not install. On Linux the
            tarball is also the self-updating one — a `.deb` lives in
            root-owned `/opt`, so that copy cannot replace itself and will
            point you back here instead.

            **You only have to download once.** The app checks for new releases
            daily and installs them itself — silently on Linux and Windows,
            applied the next time you open it. On macOS and Android it downloads
            the update and hands it to the system installer, which asks you to
            confirm, because unsigned software cannot install without that
            prompt. Turn it off in Settings → Updates.

            ### First launch

            These builds are **unsigned** — signing certificates cost money and
            this project does not have them yet. Your OS will object once:

            - **macOS** — right-click the app → **Open** → **Open**. If it says
              the app is "damaged", run
              `xattr -dr com.apple.quarantine "/Applications/SHIFT AI.app"`.
            - **Windows** — SmartScreen shows a blue box: **More info** →
              **Run anyway**.
            - **Android** — allow installs from unknown sources for your file
              manager when prompted.
            - **Linux** — extract the archive and run `./shift_ai`.

            ### What differs from the web version

            Dictation, live voice, paste/drag-drop intake and printing are
            browser APIs and stay browser-only. Artifact previews and generated
            audio open in your system browser and audio player rather than
            inline. Everything else — chats, projects, artifacts, downloads,
            bring-your-own-key providers — works the same, and chats now persist
            between launches.

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Follows redirects deliberately. `releases/latest/download/<name>`
      # answers 302 whether or not the asset exists — a missing one redirects
      # to a 404 page — so checking headers alone reports success for a dead
      # link. That is exactly how two broken buttons shipped, so this asks for
      # the first byte and insists on 200/206.
      - name: Every download button must resolve
        run: |
          assets="
            SHIFT-AI-macos.dmg
            SHIFT-AI-windows-setup.exe
            SHIFT-AI-linux-amd64.deb
            SHIFT-AI-android.apk
            SHIFT-AI-windows.zip
            SHIFT-AI-linux-x64.tar.gz
          "
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          fail=0
          for a in $assets; do
            code=000
            # `latest` can lag a moment behind the publish.
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "$base/$a" || echo 000)
              case "$code" in 200|206) break ;; esac
              sleep 10
            done
            case "$code" in
              200|206) printf '  ok    %-32s %s\n' "$a" "$code" ;;
              *)       printf '  FAIL  %-32s %s\n' "$a" "$code"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::A download button in README.md points at an asset this release does not publish."
            exit 1
          fi
