name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/shiftai-flutter-chat-app-rjtgyj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The analyzer only resolves the default branch of a conditional import,
      # so a stale `if (dart.library.html)` path passes analysis and fails only
      # at build. And an interface alone does not keep a backend swappable —
      # one direct import from a widget re-welds it, quietly.
      - name: Check conditional imports and the backend boundary
        run: |
          python3 tool/scan_conditional_imports.py
          python3 tool/scan_backend_boundary.py
          python3 tool/scan_proxy_providers.py

      # --no-web-resources-cdn bundles CanvasKit locally instead of loading it
      # from gstatic, so the app boots even where that CDN is blocked or slow —
      # consistent with the app's CDN-free design (bundled fonts + mermaid).
      - name: Build web
        # The project's URL and anon key now live in lib/backend/
        # backend_config.dart, so an ordinary build is configured and this step
        # only has to get out of the way.
        #
        # It did not, before: it passed the repository variables
        # unconditionally, and they had never been set — so every deploy
        # compiled `SHIFT_SUPABASE_URL=""`, which is not "no opinion", it is
        # "there is no backend". The app hid its account section exactly as it
        # is supposed to when unconfigured, and sign-in was missing from the
        # site with nothing to say why. An empty override is the one value that
        # must never be passed by accident, so it is now passed only when both
        # variables are actually set — which is still how a staging project or
        # a self-hosted stack would be pointed at.
        run: |
          defines=""
          if [ -n "${{ vars.SHIFT_SUPABASE_URL }}" ] \
            && [ -n "${{ vars.SHIFT_SUPABASE_ANON_KEY }}" ]; then
            defines="--dart-define=SHIFT_SUPABASE_URL=${{ vars.SHIFT_SUPABASE_URL }}"
            defines="$defines --dart-define=SHIFT_SUPABASE_ANON_KEY=${{ vars.SHIFT_SUPABASE_ANON_KEY }}"
            echo "Overriding the built-in project with the repository variables."
          fi
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" $defines

      # Belt-and-suspenders SPA fallback. The app itself never changes the
      # browser URL (single-route IndexedStack navigation), so this normally
      # shouldn't matter, but it protects against a stray deep link 404-ing
      # on GitHub Pages' static hosting.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
