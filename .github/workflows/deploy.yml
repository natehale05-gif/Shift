name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/shiftai-flutter-chat-app-rjtgyj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The analyzer only resolves the default branch of a conditional import,
      # so a stale `if (dart.library.html)` path passes analysis and fails only
      # at build. And an interface alone does not keep a backend swappable —
      # one direct import from a widget re-welds it, quietly.
      - name: Check conditional imports and the backend boundary
        run: |
          python3 tool/scan_conditional_imports.py
          python3 tool/scan_backend_boundary.py

      # --no-web-resources-cdn bundles CanvasKit locally instead of loading it
      # from gstatic, so the app boots even where that CDN is blocked or slow —
      # consistent with the app's CDN-free design (bundled fonts + mermaid).
      - name: Build web
        # SHIFT_SUPABASE_URL and SHIFT_SUPABASE_ANON_KEY are public by
        # design — they ship inside the downloaded app, and row security is
        # what protects the data, not their secrecy. They are repository
        # *variables* rather than secrets for exactly that reason: a secret
        # here would imply a protection it does not provide, and GitHub masks
        # secrets in logs, which makes a misconfigured build harder to debug
        # for no gain. With them unset the app builds on NoBackend and works
        # signed out, which is what the public demo does.
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SHIFT_SUPABASE_URL="${{ vars.SHIFT_SUPABASE_URL }}" \
            --dart-define=SHIFT_SUPABASE_ANON_KEY="${{ vars.SHIFT_SUPABASE_ANON_KEY }}"

      # Belt-and-suspenders SPA fallback. The app itself never changes the
      # browser URL (single-route IndexedStack navigation), so this normally
      # shouldn't matter, but it protects against a stray deep link 404-ing
      # on GitHub Pages' static hosting.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
