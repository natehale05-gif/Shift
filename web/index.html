<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Without this, mobile browsers lay the page out at a ~980px desktop width and
    scale it down, which makes the whole app render tiny on a phone. Flutter's
    bootstrap does not inject one, so it has to live here.
    `viewport-fit=cover` lets the app paint under iOS safe areas.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1C" media="(prefers-color-scheme: dark)">
  <meta name="description"
        content="SHIFT AI — one studio, every AI tool. A middleware AI that routes your request to the right specialized studio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SHIFT AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SHIFT AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Boot splash. Flutter on the web ships a CanvasKit engine plus the compiled
      app before it can paint its first frame, which on a phone is several
      seconds of otherwise-blank white page. This markup is plain HTML/CSS, so
      the browser paints it on the very first frame and the app never looks
      broken while it loads. `main.dart` removes it once Flutter is up.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F5F4EF;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1A1C; }
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F5F4EF;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      /* Fade out rather than snapping, so the handoff to Flutter is calm. */
      transition: opacity 340ms ease;
      z-index: 9999;
    }
    @media (prefers-color-scheme: dark) {
      #boot { background: #1A1A1C; color: #F5F5F7; }
    }
    #boot.boot--done { opacity: 0; pointer-events: none; }

    .boot__mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #AF52DE, #8944CC);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(175, 82, 222, 0.28);
      animation: boot-pulse 1.8s ease-in-out infinite;
    }
    .boot__mark svg { width: 30px; height: 30px; }

    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    .boot__name {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-indent: 0.24em;
      margin: 0;
    }

    .boot__track {
      width: 168px;
      height: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .boot__track { background: rgba(255, 255, 255, 0.14); }
    }
    .boot__fill {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #AF52DE;
      animation: boot-slide 1.25s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    .boot__hint {
      font-size: 12.5px;
      opacity: 0.55;
      margin: 0;
      text-align: center;
      padding: 0 24px;
      max-width: 300px;
      line-height: 1.45;
    }

    /* Respect users who ask for less motion. */
    @media (prefers-reduced-motion: reduce) {
      .boot__mark, .boot__fill { animation: none; }
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.6l1.9 5.1 5.1 1.9-5.1 1.9L12 16.6l-1.9-5.1L5 9.6l5.1-1.9L12 2.6z"
              fill="#fff"/>
        <path d="M18.4 14.4l.85 2.25 2.25.85-2.25.85-.85 2.25-.85-2.25-2.25-.85 2.25-.85.85-2.25z"
              fill="#fff" opacity="0.85"/>
      </svg>
    </div>
    <p class="boot__name">SHIFT AI</p>
    <div class="boot__track" role="progressbar" aria-label="Loading SHIFT AI">
      <div class="boot__fill"></div>
    </div>
    <p class="boot__hint">Starting up — the first visit loads the engine, then it's cached.</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
