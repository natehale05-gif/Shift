name: shift_ai
description: "SHIFT AI — a middleware AI chat app that routes to specialized creation studios."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.2+3

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_highlight: ^0.7.0
  gpt_markdown: ^1.1.8
  file_selector: ^1.0.3
  # 2.7+ needs a newer Dart SDK than this project's pinned Flutter ships.
  idb_shim: ^2.6.7
  http: ^1.2.2
  # Streaming fetch on web — package:http's XHR-based BrowserClient buffers
  # whole responses, which breaks incremental SSE.
  fetch_client: ^1.2.1
  # ZIP encoder for real deliverables: .pptx decks and .zip brand/reel packs
  # are OOXML/ZIP containers assembled in-browser.
  archive: ^3.6.1
  # Desktop/Android only: locates the per-app directory the sembast
  # database lives in, so a downloaded app keeps its data across restarts.
  path_provider: ^2.1.4
  # Opens links and artifact previews in the system browser off-web.
  url_launcher: ^6.3.0
  # The running build's own version, read from the packaged manifest rather
  # than a constant that would drift from the `version:` field above. The
  # updater compares it against the newest GitHub release.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled JS libraries inlined into sandboxed iframes at runtime (CDN-free,
  # offline-capable — same rationale as the bundled fonts). mermaid renders
  # ```mermaid diagrams inline in chat.
  assets:
    - assets/js/mermaid.min.js
    # Lets the Linux GTK runner set the window and taskbar icon at startup —
    # flutter_launcher_icons has no Linux target.
    - assets/icon/app_icon.png

  # Bundled locally (not fetched from a font CDN at runtime) so text renders
  # reliably on static GitHub Pages hosting with no backend and no guaranteed
  # network access to third-party font services. Inter (SIL Open Font
  # License, freely redistributable) reads closer to SF Pro's proportions
  # than Roboto for the Apple-HIG-adjacent feel this app is going for.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Registered under the literal family name "monospace" — CanvasKit
    # renders text from bundled font bytes only, it does not fall back to
    # the browser's generic "monospace" font stack the way HTML/CSS would.
    # This is what the Code Studio artifact card's code view resolves to
    # (both flutter_highlight's own default and our explicit TextStyle
    # request font family "monospace").
    - family: monospace
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # Serif display face (SIL OFL) for the wordmark, empty-state greeting,
    # artifact titles, and section headers — the Anthropic half of the
    # Anthropic-meets-Apple identity. Body text stays Inter.
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icons for every platform, generated from one source PNG:
#   dart run flutter_launcher_icons
# The source is assets/icon/app_icon.png (1024x1024). Regenerate after
# replacing it; the generated files are committed so CI needs no extra step.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  # Legacy square icon only. An adaptive icon needs a transparent glyph-only
  # foreground; without one, Android's circular mask crops the artwork's
  # rounded-square plate at the corners. Revisit if that file ever exists.
  android: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    # Matches the HTML boot splash (web/index.html) so an installed PWA does
    # not flash a dark panel before the app's own light background appears.
    background_color: "#F5F4EF"
    theme_color: "#AF52DE"
